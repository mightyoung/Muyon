[workspace]
resolver = "2"
members = ["muyon-core", "muyon-android-ffi"]

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
unicode-normalization = "=0.1.25"

[profile.dev]
debug = 0
incremental = false

[profile.release]
panic = "unwind"
strip = "debuginfo"
