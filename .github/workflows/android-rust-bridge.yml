name: Android Rust bridge

on:
  push:
    branches: ['lab/android-rust-bridge-*']
    paths:
      - 'experiments/redesign/android-rust-bridge-lab/**'
      - 'experiments/redesign/android-compose-lab/**'
      - 'experiments/redesign/core-agent-lab/**'
      - 'experiments/redesign/plugin-contract-lab/**'
      - 'experiments/redesign/rust-agent-host-lab/**'
      - 'docs/design/ANDROID-RUST-*'
      - '.github/workflows/android-rust-bridge.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'experiments/redesign/android-rust-bridge-lab/**'
      - 'experiments/redesign/android-compose-lab/**'
      - 'experiments/redesign/core-agent-lab/**'
      - 'experiments/redesign/plugin-contract-lab/**'
      - 'experiments/redesign/rust-agent-host-lab/**'
      - '.github/workflows/android-rust-bridge.yml'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Full gate, immutable assertion RED, or explicitly partial host checkpoint'
        type: choice
        options: [full, red, rust-red, jvm-red, service-rust-red, service-jvm-red, service-host-checkpoint, service-oracle-red]
        default: full
      emit_android_source:
        description: 'Diagnostic only: bounded generated Android source in service-jvm-red ordinary logs'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  select:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'lab/android-rust-bridge-')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      red: ${{ steps.mode.outputs.red }}
    steps:
      - id: mode
        env:
          REQUESTED_SUITE: ${{ inputs.suite }}
          SOURCE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os
          suite = os.environ['REQUESTED_SUITE']
          ref = os.environ['SOURCE_REF']
          if not suite:
              suite = next((name for name in ['rust-red', 'jvm-red', 'service-rust-red', 'service-jvm-red', 'service-host-checkpoint', 'service-oracle-red'] if ref.startswith('lab/android-rust-bridge-' + name + '-')), 'full')
          if suite not in ['full', 'red', 'rust-red', 'jvm-red', 'service-rust-red', 'service-jvm-red', 'service-host-checkpoint', 'service-oracle-red']:
              raise SystemExit('invalid_suite')
          red = ['rust-red', 'jvm-red'] if suite == 'red' else [suite] if suite.endswith('-red') and suite != 'service-oracle-red' else []
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('mode=' + ('red' if red else suite) + '\nred=' + json.dumps(red) + '\n')
          PY

  compiling-red:
    needs: select
    if: needs.select.outputs.mode == 'red'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.select.outputs.red) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        if: endsWith(matrix.suite, 'jvm-red')
        with:
          distribution: temurin
          java-version: '17'
      - name: Install exact official Rust toolchain on temporary remote runner
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          dirname "$(rustup which --toolchain 1.99.0 rustc)" >> "$GITHUB_PATH"
      - name: Independent strict verifier and evidence classifier controls
        run: python3 -B -m unittest discover -s experiments/redesign/android-rust-bridge-lab/checks -p 'test_*.py'
      - name: Required compiled reachable RED stays a CI failure
        env:
          BRIDGE_RED_MODE: ${{ matrix.suite }}
          BRIDGE_EMIT_ANDROID_SOURCE: ${{ inputs.emit_android_source && 'true' || 'false' }}
        run: |
          binding_args=()
          if [[ "$BRIDGE_EMIT_ANDROID_SOURCE" == true ]]; then binding_args=(--emit-android-source); fi
          python3 -B experiments/redesign/android-rust-bridge-lab/checks/linux_gate.py \
            --mode "$BRIDGE_RED_MODE" \
            --evidence-dir "$RUNNER_TEMP/android-bridge-evidence" \
            --work-dir "$RUNNER_TEMP/android-bridge-work" "${binding_args[@]}"
      - name: Preserve raw setup build generation load and behavior evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-bridge-${{ github.sha }}-${{ matrix.suite }}
          path: ${{ runner.temp }}/android-bridge-evidence/
          retention-days: 1
          if-no-files-found: error

  service-host-checkpoint:
    needs: select
    if: needs.select.outputs.mode == 'service-host-checkpoint' || needs.select.outputs.mode == 'service-oracle-red'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact official Rust on temporary remote runner
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          dirname "$(rustup which --toolchain 1.99.0 rustc)" >> "$GITHUB_PATH"
      - name: Independent checkpoint and existing classifier controls
        run: python3 -B -m unittest discover -s experiments/redesign/android-rust-bridge-lab/checks -p 'test_*.py'
      - name: Required partial host or exact controller-oracle RED
        env:
          BRIDGE_HOST_MODE: ${{ needs.select.outputs.mode }}
        run: |
          python3 -B experiments/redesign/android-rust-bridge-lab/checks/linux_gate.py \
            --mode "$BRIDGE_HOST_MODE" --evidence-dir "$RUNNER_TEMP/service-host-checkpoint-evidence" \
            --work-dir "$RUNNER_TEMP/service-host-checkpoint-work"
      - name: Preserve complete host checkpoint raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: service-host-checkpoint-${{ github.sha }}-${{ needs.select.outputs.mode }}
          path: ${{ runner.temp }}/service-host-checkpoint-evidence/
          retention-days: 1
          if-no-files-found: error

  required-linux:
    needs: select
    if: needs.select.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - name: Install exact official Rust toolchain on temporary remote runner
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          dirname "$(rustup which --toolchain 1.99.0 rustc)" >> "$GITHUB_PATH"
      - name: Independent strict controls
        run: python3 -B -m unittest discover -s experiments/redesign/android-rust-bridge-lab/checks -p 'test_*.py'
      - name: Required native nine plus real JVM shipping load-negative and panic recovery
        run: |
          python3 -B experiments/redesign/android-rust-bridge-lab/checks/linux_gate.py \
            --mode full --evidence-dir "$RUNNER_TEMP/android-bridge-linux-evidence" \
            --work-dir "$RUNNER_TEMP/android-bridge-linux-work"
      - name: Retain complete Linux evidence and fresh Android binding
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-bridge-linux-${{ github.sha }}
          path: ${{ runner.temp }}/android-bridge-linux-evidence/
          retention-days: 1
          if-no-files-found: error

  required-android:
    needs: select
    if: needs.select.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - name: Exact official Rust and Android target components on temporary remote runner
        run: |
          rustup toolchain install 1.99.0 --profile minimal --target aarch64-linux-android --target x86_64-linux-android
          dirname "$(rustup which --toolchain 1.99.0 rustc)" >> "$GITHUB_PATH"
      - name: Independent strict controls
        run: python3 -B -m unittest discover -s experiments/redesign/android-rust-bridge-lab/checks -p 'test_*.py'
      - name: Required fresh API24 link ELF JNI and NDK stub compatibility
        env:
          BRIDGE_ABI: ${{ matrix.abi }}
        run: |
          python3 -B experiments/redesign/android-rust-bridge-lab/checks/android_gate.py \
            --abi "$BRIDGE_ABI" --evidence-dir "$RUNNER_TEMP/android-bridge-abi-evidence" \
            --work-dir "$RUNNER_TEMP/android-bridge-abi-work"
      - name: Retain raw actual link ELF and ABI identity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-bridge-${{ matrix.abi }}-${{ github.sha }}
          path: ${{ runner.temp }}/android-bridge-abi-evidence/
          retention-days: 1
          if-no-files-found: error

  required-full:
    needs: [select, required-linux, required-android]
    if: always() && (needs.select.outputs.mode == 'full' || needs.select.result != 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Require every full producer to complete successfully
        env:
          SELECT_RESULT: ${{ needs.select.result }}
          LINUX_RESULT: ${{ needs.required-linux.result }}
          ANDROID_RESULT: ${{ needs.required-android.result }}
        run: |
          python3 - <<'PY'
          import os
          results = [os.environ[key] for key in ['SELECT_RESULT', 'LINUX_RESULT', 'ANDROID_RESULT']]
          if results != ['success', 'success', 'success']:
              raise SystemExit('ANDROID_BRIDGE_PRODUCER_REQUIRED')
          print('ANDROID_BRIDGE_ALL_PRODUCERS_SUCCESS')
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - name: Download exact current-head Linux producer evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: android-bridge-linux-${{ github.sha }}
          path: ${{ runner.temp }}/android-bridge-input-artifacts/linux
      - name: Download exact current-head arm64 producer evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: android-bridge-arm64-v8a-${{ github.sha }}
          path: ${{ runner.temp }}/android-bridge-input-artifacts/arm64-v8a
      - name: Download exact current-head x86 producer evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: android-bridge-x86_64-${{ github.sha }}
          path: ${{ runner.temp }}/android-bridge-input-artifacts/x86_64
      - name: Required same-source input verification 67 state checks lint build and APK native bytes
        run: |
          python3 -B experiments/redesign/android-rust-bridge-lab/checks/package_gate.py \
            --artifacts "$RUNNER_TEMP/android-bridge-input-artifacts" \
            --evidence-dir "$RUNNER_TEMP/android-bridge-package-evidence" \
            --work-dir "$RUNNER_TEMP/android-bridge-package-work"
      - name: Retain raw packaging lint APK zipalign and identity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-bridge-package-${{ github.sha }}
          path: ${{ runner.temp }}/android-bridge-package-evidence/
          retention-days: 1
          if-no-files-found: error
