# Manual preparation only: registration and first execution are separate decisions.
name: windows-experience-package
run-name: Windows experience package at ${{ inputs.target_sha }}

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Reviewed final experience candidate: full lowercase 40-character SHA'
        required: true
        type: string
      artifact_storage_approved:
        description: 'Approved one-day artifact storage and public-repository download scope'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-experience-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      STORAGE_APPROVED: ${{ inputs.artifact_storage_approved }}
      PACKAGE_PLATFORM: windows
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
    steps:
      - name: Validate manual inputs
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Full lowercase commit SHA required'; exit 1; }
          test "$STORAGE_APPROVED" = true || { echo 'Artifact storage and download scope approval required'; exit 1; }

      - name: Checkout packaging tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow
          persist-credentials: false

      - name: Checkout exact reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.target_sha }}
          path: source
          persist-credentials: false

      - name: Verify immutable checkouts and Windows project
        run: |
          test "$(git -C source rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C workflow rev-parse HEAD)" = "$WORKFLOW_SHA"
          test -d source/apps/muyon/windows
          test -f workflow/scripts/package_artifacts/package.py

      - name: Set up pinned Flutter without persistent cache
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: false

      - name: Resolve existing locked workspace dependencies
        working-directory: source
        run: flutter pub get --enforce-lockfile

      - name: Build complete unsigned Windows Release bundle
        working-directory: source/apps/muyon
        run: flutter build windows --release --no-pub

      - name: Package only build output with provenance and SHA256
        run: python workflow/scripts/package_artifacts/package.py

      - name: Keep only ZIP and manifest for one day
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: muyon-windows-${{ inputs.target_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            packages/muyon-windows-*.zip
            packages/manifest.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false
