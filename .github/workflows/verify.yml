# Manual gate only: Actions → "verify" → Run workflow (pick a branch).
# Runs the same scripts/verify.sh used locally. macOS because the inquiry
# screenshot baselines were rendered there.
name: verify

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    needs: [laya-offline]
    if: ${{ always() }}
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Require independent Laya success
        if: ${{ always() }}
        env:
          LAYA_RESULT: ${{ needs['laya-offline'].result }}
        run: '[[ "$LAYA_RESULT" == success ]]'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Analyze and test every package
        run: bash scripts/verify.sh 2>&1 | tee verify.log; exit "${PIPESTATUS[0]}"

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-log
          path: verify.log
          if-no-files-found: ignore

  # Independent from Flutter success/failure; a failed test fails this job.
  laya-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Provision pinned contract test dependency
        run: python3 -m pip install PyYAML==6.0.3
      - name: Fetch immutable provenance commits
        run: >-
          git fetch --no-tags --depth=1 origin
          214b4031deb38ca7dfd35ee86396089eb48157d5
          01e56cc2d729dab70e1b1def05c3aa93b28f421a
          8c5995515fa14ca3592a1c33c71afb4e4c1e5def
          4d15b990f725d41a43b86fcd2b170b2219a6f766
      - name: Verify frozen references and prerequisite contracts
        run: |
          python3 -B scripts/check_legacy_schema_reference.py
          python3 -B scripts/test_retirement_prerequisites.py
      - name: Existing four synthetic Laya tests (no Flutter or user credentials)
        run: bash scripts/check_laya_offline.sh
