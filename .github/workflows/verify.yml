# Manual gate only: Actions → "verify" → Run workflow (pick a branch).
# Runs the same scripts/verify.sh used locally. macOS because the inquiry
# screenshot baselines were rendered there.
name: verify

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Analyze and test every package
        run: bash scripts/verify.sh 2>&1 | tee verify.log; exit "${PIPESTATUS[0]}"

      - name: Laya script tests (no network, no .env)
        working-directory: scripts/laya
        run: |
          for t in test_stage1_contract test_stage2_data test_stage2_threshold test_kaggle_submit; do
            python3 "$t.py"
          done

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-log
          path: verify.log
          if-no-files-found: ignore
