name: Android Compose lab

on:
  push:
    branches: ['lab/android-compose-*']
    paths:
      - 'experiments/redesign/android-compose-lab/**'
      - '.github/workflows/android-compose-lab.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'experiments/redesign/android-compose-lab/**'
      - '.github/workflows/android-compose-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-compose-lab-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  compile:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref_name, 'lab/android-compose-')) ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'lab/android-compose-') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LAB_DIRECTORY: experiments/redesign/android-compose-lab
      GRADLE_VERSION: '8.13'
      GRADLE_SHA256: 20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Initialize isolated temporary directories
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/muyon-compose-evidence" "$RUNNER_TEMP/muyon-compose-android-user"
          {
            printf 'GRADLE_USER_HOME=%s\n' "$RUNNER_TEMP/muyon-compose-gradle-cache"
            printf 'ANDROID_USER_HOME=%s\n' "$RUNNER_TEMP/muyon-compose-android-user"
            printf 'LOG_DIRECTORY=%s\n' "$RUNNER_TEMP/muyon-compose-evidence"
          } >> "$GITHUB_ENV"
      - name: JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Record source and declared pins
        shell: bash
        run: |
          mkdir -p "$LOG_DIRECTORY" "$ANDROID_USER_HOME"
          git rev-parse HEAD > "$LOG_DIRECTORY/source-sha.txt"
          git ls-files -z "$LAB_DIRECTORY" .github/workflows/android-compose-lab.yml |
            sort -z | xargs -0 sha256sum > "$LOG_DIRECTORY/source-files.sha256"
          {
            java -version 2>&1
            printf '%s\n' 'Gradle=8.13; AGP=8.11.1; Kotlin/ComposeCompiler=2.2.20'
            printf '%s\n' 'ComposeBOM=2025.09.01; compileSdk=36; buildTools=35.0.0'
            printf '%s\n' 'Android installation/runtime/emulator/rendering=NOT_RUN'
          } > "$LOG_DIRECTORY/tool-pins.txt"
      - name: Fetch and verify official Gradle distribution
        shell: bash
        run: |
          distribution="$RUNNER_TEMP/gradle-$GRADLE_VERSION-bin.zip"
          curl --fail --location --retry 3 --output "$distribution" \
            "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
          printf '%s  %s\n' "$GRADLE_SHA256" "$distribution" |
            sha256sum --check | tee "$LOG_DIRECTORY/gradle-checksum.txt"
          unzip -q "$distribution" -d "$RUNNER_TEMP/muyon-compose-tools"
          "$RUNNER_TEMP/muyon-compose-tools/gradle-$GRADLE_VERSION/bin/gradle" --version \
            > "$LOG_DIRECTORY/gradle-version.txt"
      - name: Ensure official SDK build packages
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$manager"
          "$manager" --version > "$LOG_DIRECTORY/sdkmanager-version.txt"
          "$manager" --sdk_root="$sdk_root" --install \
            'platforms;android-36' 'build-tools;35.0.0' 2>&1 |
            tee "$LOG_DIRECTORY/sdk-packages.txt"
          test -f "$sdk_root/platforms/android-36/android.jar"
          test -x "$sdk_root/build-tools/35.0.0/aapt2"
          printf 'ANDROID_HOME=%s\n' "$sdk_root" >> "$GITHUB_ENV"
      - name: Required JVM checks and Android source compilation
        shell: bash
        run: |
          set +e
          "$RUNNER_TEMP/muyon-compose-tools/gradle-$GRADLE_VERSION/bin/gradle" \
            --no-daemon --stacktrace --console=plain -p "$LAB_DIRECTORY" \
            :state:check :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 |
            tee "$LOG_DIRECTORY/required-build.log"
          gradle_exit=${PIPESTATUS[0]}
          set -e
          required_exit=$gradle_exit
          if [[ $gradle_exit -eq 0 ]]; then
            for marker in '16/16 pure JVM state checks passed' '22/22 local UI state checks passed'; do
              if ! grep -Fq "$marker" "$LOG_DIRECTORY/required-build.log"; then
                required_exit=1
              fi
            done
          fi
          printf 'gradle_exit=%s\nrequired_exit=%s\n' "$gradle_exit" "$required_exit" \
            > "$LOG_DIRECTORY/required-exit.txt"
          exit "$required_exit"
      - name: Record unexecuted boundaries even after setup failure
        if: always()
        shell: bash
        run: |
          mkdir -p "$LOG_DIRECTORY"
          if [[ ! -f "$LOG_DIRECTORY/required-exit.txt" ]]; then
            printf 'gradle_exit=NOT_RUN\nrequired_exit=NOT_RUN\n' > "$LOG_DIRECTORY/required-exit.txt"
          fi
          printf '%s\n' 'Android installation/runtime=NOT_RUN' 'Compose rendering=NOT_RUN' \
            'Rust integration=NOT_CONNECTED' 'WorkBuddy pixel fidelity=UNVERIFIED' \
            > "$LOG_DIRECTORY/unexecuted-boundaries.txt"
      - name: Upload compilation evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-compose-lab-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/muyon-compose-evidence
          if-no-files-found: warn
          retention-days: 7
