# Automatic gate: analyze and test every package on Linux for each push to the
# integration/task branches and for pull requests into develop/main.
# Golden/screenshot tests are excluded in scripts/ci.sh (baselines are macOS);
# the manual `verify` workflow still runs them on macOS.
name: ci

on:
  push:
    branches:
      - develop
      - main
      - 'task/**'
      - 'review/**'
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Analyze and test every package
        run: bash scripts/ci.sh 2>&1 | tee ci.log; exit "${PIPESTATUS[0]}"

      - name: Laya script tests (no network, no .env)
        working-directory: scripts/laya
        run: |
          for t in test_stage1_contract test_stage2_data test_stage2_threshold test_kaggle_submit; do
            python3 "$t.py"
          done

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-log
          path: ci.log
          if-no-files-found: ignore
