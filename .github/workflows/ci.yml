# Automatic gate: analyze and test every package on Linux for each push to the
# integration/task branches and for pull requests into develop/main.
# Tests self-skip where platform/font/model requirements are unavailable;
# the manual `verify` workflow still runs them on macOS.
name: ci

on:
  push:
    branches:
      - develop
      - main
      - 'task/**'
      - 'review/**'
      - 'lab/pr101-coverage-contract-fix-20261022'
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    needs: [laya-offline]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Require independent Laya success
        if: ${{ always() }}
        env:
          LAYA_RESULT: ${{ needs['laya-offline'].result }}
        run: '[[ "$LAYA_RESULT" == success ]]'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Analyze and test every package
        run: bash scripts/ci.sh 2>&1 | tee ci.log; exit "${PIPESTATUS[0]}"

      - name: Coverage summary
        if: always()
        run: |
          if [[ -f .coverage-run/summary.json ]]; then
            python3 - <<'PY'
          import base64, gzip, json, os
          from pathlib import Path
          data = json.loads(Path('.coverage-run/summary.json').read_text())
          data['actions_run_id'] = os.environ['GITHUB_RUN_ID']
          data['suite_outcomes'] = json.loads(Path('.coverage-run/suite-summary.json').read_text())
          snapshot = json.dumps(data, separators=(',', ':')).encode()
          print('COVERAGE_SNAPSHOT_GZIP_BASE64=' + base64.b64encode(gzip.compress(snapshot, mtime=0)).decode())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('Loaded executable line coverage; whole-package denominator unknown.\n\n')
              out.write('| Package | Hit / loaded executable | % | Unloaded files |\n|---|---:|---:|---:|\n')
              for package, p in data['packages'].items():
                  out.write(f"| {package} | {p['hit_lines']} / {p['loaded_executable_lines']} | {p['loaded_line_percent']} | {len(p['unloaded_source_files'])} |\n")
              out.write('\nLinux self-skips and platform/model limitations remain; UI behavior tests are included.\n')
          PY
          fi

      - name: Keep coverage summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: |
            .coverage-run/summary.json
            .coverage-run/suite-summary.json
            .coverage-run/da-details.json
          if-no-files-found: error

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-log
          path: ci.log
          if-no-files-found: ignore

  # Independent from Flutter success/failure; a failed test fails this job.
  laya-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Provision pinned contract test dependency
        run: python3 -m pip install PyYAML==6.0.3
      - name: Fetch immutable provenance commits
        run: >-
          git fetch --no-tags --depth=1 origin
          214b4031deb38ca7dfd35ee86396089eb48157d5
          01e56cc2d729dab70e1b1def05c3aa93b28f421a
          8c5995515fa14ca3592a1c33c71afb4e4c1e5def
          4d15b990f725d41a43b86fcd2b170b2219a6f766
      - name: Verify frozen references and prerequisite contracts
        run: |
          python3 -B scripts/check_legacy_schema_reference.py
          python3 -B scripts/test_retirement_prerequisites.py
      - name: Existing four synthetic Laya tests (no Flutter or user credentials)
        run: bash scripts/check_laya_offline.sh
