name: Android minimum API 26

on:
  push:
    branches: ['task/leaderb-min26-20261018']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shipping:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: false
      - name: Record exact checkout and enforce locked dependencies
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git log -1 --format=%H
          flutter --version
          flutter pub get --enforce-lockfile
      - name: Build complete shipping APK and check observer
        working-directory: apps/muyon
        run: |
          set -o pipefail
          flutter build apk --release --no-pub 2>&1 | tee "$RUNNER_TEMP/shipping-build.log"
          cd android
          ./gradlew --no-daemon :agent-observation:checkObservation :app:lintRelease 2>&1 | tee "$RUNNER_TEMP/shipping-lint.log"
      - name: Inspect actual APK minimum API and source provenance
        run: |
          apk=apps/muyon/build/app/outputs/flutter-apk/app-release.apk
          test -f "$apk"
          sha256sum "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$apk" > "$RUNNER_TEMP/shipping-badging.log"
          python3 - <<'PYCODE'
          import os, re
          from pathlib import Path
          raw = Path(os.environ['RUNNER_TEMP'], 'shipping-badging.log').read_text()
          rows = re.findall(r"^minSdkVersion:(.*)$", raw, re.M)
          assert rows == ["'26'"], rows
          print('SOURCE_SHA=' + os.environ['GITHUB_SHA'])
          print('APK_MIN_API=26; Android runtime=NOT_RUN')
          print('\n'.join(line for line in raw.splitlines() if 'SdkVersion:' in line))
          PYCODE
      - name: Preserve build and APK inspection logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: min26-shipping-${{ github.sha }}
          path: ${{ runner.temp }}/shipping-*.log
          retention-days: 3
          if-no-files-found: warn

  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LAB_DIRECTORY: experiments/redesign/android-compose-lab
      GRADLE_VERSION: '8.13'
      GRADLE_SHA256: 20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Initialize isolated temporary directories
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/muyon-compose-evidence" "$RUNNER_TEMP/muyon-compose-android-user"
          {
            printf 'GRADLE_USER_HOME=%s\n' "$RUNNER_TEMP/muyon-compose-gradle-cache"
            printf 'ANDROID_USER_HOME=%s\n' "$RUNNER_TEMP/muyon-compose-android-user"
            printf 'LOG_DIRECTORY=%s\n' "$RUNNER_TEMP/muyon-compose-evidence"
          } >> "$GITHUB_ENV"
      - name: JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Record source and declared pins
        shell: bash
        run: |
          mkdir -p "$LOG_DIRECTORY" "$ANDROID_USER_HOME"
          git rev-parse HEAD > "$LOG_DIRECTORY/source-sha.txt"
          git ls-files -z "$LAB_DIRECTORY" .github/workflows/android-min26.yml |
            sort -z | xargs -0 sha256sum > "$LOG_DIRECTORY/source-files.sha256"
          {
            java -version 2>&1
            printf '%s\n' 'Gradle=8.13; AGP=8.11.1; Kotlin/ComposeCompiler=2.2.20'
            printf '%s\n' 'ComposeBOM=2025.09.01; compileSdk=36; buildTools=35.0.0'
            printf '%s\n' 'Android installation/runtime/emulator/rendering=NOT_RUN'
          } > "$LOG_DIRECTORY/tool-pins.txt"
      - name: Fetch and verify official Gradle distribution
        shell: bash
        run: |
          distribution="$RUNNER_TEMP/gradle-$GRADLE_VERSION-bin.zip"
          curl --fail --location --retry 3 --output "$distribution" \
            "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
          printf '%s  %s\n' "$GRADLE_SHA256" "$distribution" |
            sha256sum --check | tee "$LOG_DIRECTORY/gradle-checksum.txt"
          unzip -q "$distribution" -d "$RUNNER_TEMP/muyon-compose-tools"
          "$RUNNER_TEMP/muyon-compose-tools/gradle-$GRADLE_VERSION/bin/gradle" --version \
            > "$LOG_DIRECTORY/gradle-version.txt"
      - name: Ensure official SDK build packages
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$manager"
          "$manager" --version > "$LOG_DIRECTORY/sdkmanager-version.txt"
          "$manager" --sdk_root="$sdk_root" --install \
            'platforms;android-36' 'build-tools;35.0.0' 2>&1 |
            tee "$LOG_DIRECTORY/sdk-packages.txt"
          test -f "$sdk_root/platforms/android-36/android.jar"
          test -x "$sdk_root/build-tools/35.0.0/aapt2"
          printf 'ANDROID_HOME=%s\n' "$sdk_root" >> "$GITHUB_ENV"
      - name: Required JVM checks and Android source compilation
        shell: bash
        run: |
          set +e
          "$RUNNER_TEMP/muyon-compose-tools/gradle-$GRADLE_VERSION/bin/gradle" \
            --no-daemon --stacktrace --console=plain -p "$LAB_DIRECTORY" \
            :state:check :app:assembleDebug :app:assembleDebugAndroidTest \
            :app:compileDebugUnitTestKotlin :app:lintDebug 2>&1 |
            tee "$LOG_DIRECTORY/required-build.log"
          gradle_exit=${PIPESTATUS[0]}
          set -e
          required_exit=$gradle_exit
          if [[ $gradle_exit -eq 0 ]]; then
            for marker in '16/16 pure JVM state checks passed' '22/22 local UI state checks passed'; do
              if ! grep -Fq "$marker" "$LOG_DIRECTORY/required-build.log"; then
                required_exit=1
              fi
            done
          fi
          printf 'gradle_exit=%s\nrequired_exit=%s\n' "$gradle_exit" "$required_exit" \
            > "$LOG_DIRECTORY/required-exit.txt"
          exit "$required_exit"
      - name: Record unexecuted boundaries even after setup failure
        if: always()
        shell: bash
        run: |
          mkdir -p "$LOG_DIRECTORY"
          if [[ ! -f "$LOG_DIRECTORY/required-exit.txt" ]]; then
            printf 'gradle_exit=NOT_RUN\nrequired_exit=NOT_RUN\n' > "$LOG_DIRECTORY/required-exit.txt"
          fi
          printf '%s\n' 'Android installation/runtime=NOT_RUN' 'Compose rendering=NOT_RUN' \
            'Rust integration runtime=NOT_RUN' 'WorkBuddy pixel fidelity=UNVERIFIED' \
            > "$LOG_DIRECTORY/unexecuted-boundaries.txt"
      - name: Upload compilation evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-compose-lab-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/muyon-compose-evidence
          if-no-files-found: warn
          retention-days: 7

  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Exact source and fresh native toolchain
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git log -1 --format=%H
          rustup toolchain install 1.99.0 --profile minimal --target aarch64-linux-android --target x86_64-linux-android
          dirname "$(rustup which --toolchain 1.99.0 rustc)" >> "$GITHUB_PATH"
      - name: Strict packaging controls
        run: python3 -B -m unittest discover -s experiments/redesign/android-rust-bridge-lab/checks -p 'test_*.py'
      - name: Fresh API26 native link and exact stub compatibility
        env:
          BRIDGE_ABI: ${{ matrix.abi }}
        run: |
          python3 -B experiments/redesign/android-rust-bridge-lab/checks/android_gate.py \
            --abi "$BRIDGE_ABI" --evidence-dir "$RUNNER_TEMP/native-evidence" \
            --work-dir "$RUNNER_TEMP/native-work"
      - name: Preserve fresh native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: min26-native-${{ matrix.abi }}-${{ github.sha }}
          path: ${{ runner.temp }}/native-evidence
          retention-days: 3
          if-no-files-found: warn
