name: Ordinary chat offline
on:
  push:
    branches: ['lab/ordinary-chat-wiring-20261018']
    paths:
      - 'experiments/redesign/android-compose-lab/**'
      - 'experiments/redesign/android-rust-bridge-lab/**'
      - 'experiments/redesign/rust-agent-host-lab/**'
      - '.github/workflows/ordinary-chat-offline.yml'
permissions:
  contents: read
concurrency:
  group: ordinary-chat-offline-${{ github.ref }}
  cancel-in-progress: false
jobs:
  scoped:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with: {distribution: temurin, java-version: '17'}
      - name: Genuine binding reproduction only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/chat-scoped"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/chat-rust-target"
          export MUYON_BRIDGE_BUILD_ID="$(git rev-parse HEAD)"
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          # The only executed Rust target is the new-root, socket-free ordinary chat target.
          cargo test --locked --manifest-path experiments/redesign/rust-agent-host-lab/core/Cargo.toml --test ordinary_chat_controller -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/chat-scoped/native-test.log"
          # Build-only binding reproduction, never an aggregate suite.
          cargo build --locked --manifest-path experiments/redesign/android-rust-bridge-lab/core/Cargo.toml --features bindings 2>&1 | tee "$RUNNER_TEMP/chat-scoped/bridge.log"
          (
            cd experiments/redesign/android-rust-bridge-lab/core
            "$CARGO_TARGET_DIR/debug/uniffi-bindgen" generate --library "$CARGO_TARGET_DIR/debug/libmuyon_android_contract_bridge.so" --language kotlin --config uniffi.android.toml --out-dir "$RUNNER_TEMP/chat-generated" --no-format
          )
          generated="$RUNNER_TEMP/chat-generated/com/mightyoung/muyon/androidbridge/muyon_android_contract_bridge.kt"
          cmp "$generated" experiments/redesign/android-compose-lab/app/src/main/kotlin/com/mightyoung/muyon/androidbridge/muyon_android_contract_bridge.kt
          cp "$generated" "$RUNNER_TEMP/chat-scoped/generated-binding.kt"
          git rev-parse HEAD > "$RUNNER_TEMP/chat-scoped/source-sha.txt"
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chat-scoped
          path: ${{ runner.temp }}/chat-scoped
  native:
    strategy:
      fail-fast: false
      matrix: {abi: [arm64-v8a, x86_64]}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Existing exact-source API26 ABI producer
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal --target aarch64-linux-android,x86_64-linux-android
          rustup default 1.99.0
          python3 experiments/redesign/android-rust-bridge-lab/checks/android_gate.py --abi '${{ matrix.abi }}' --evidence-dir "$RUNNER_TEMP/chat-native" --work-dir "$RUNNER_TEMP/chat-native-work"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chat-${{ matrix.abi }}
          path: ${{ runner.temp }}/chat-native
  package-device:
    needs: [scoped, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with: {distribution: temurin, java-version: '17'}
      - name: Initialize NOT_RUN evidence
        run: |
          mkdir -p "$RUNNER_TEMP/chat-package"
          printf 'NOT_RUN: actual Compose ordinary chat\n' > "$RUNNER_TEMP/chat-package/device-result.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/chat-package/source-sha.txt"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: chat-scoped, path: '${{ runner.temp }}/chat-producers/scoped'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: chat-arm64-v8a, path: '${{ runner.temp }}/chat-producers/arm64-v8a'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: chat-x86_64, path: '${{ runner.temp }}/chat-producers/x86_64'}
      - name: Build fixed offline chat APK
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/redesign/android-rust-bridge-lab/checks/lifecycle_package.py --ordinary-chat --artifacts "$RUNNER_TEMP/chat-producers" --evidence "$RUNNER_TEMP/chat-package" --work "$RUNNER_TEMP/chat-package-work"
      - name: API26 exact Compose Service Agent ordinary chat
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/chat-package"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/muyon-chat-avds"
          mkdir -p "$ANDROID_AVD_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platform-tools' 'emulator' 'system-images;android-26;google_apis;x86_64' 2>&1 | tee "$evidence/emulator-setup.log"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          sudo chmod a+rw /dev/kvm
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n muyon-chat-api26 -k 'system-images;android-26;google_apis;x86_64' --force
          "$ANDROID_HOME/emulator/emulator" -avd muyon-chat-api26 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$evidence/emulator.log" 2>&1 &
          timeout 300 adb wait-for-device
          for attempt in $(seq 1 120); do if [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]; then break; fi; sleep 2; done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = 26
          adb shell input keyevent 82
          adb install "$evidence/app-lifecycle.apk"
          adb install "$evidence/app-lifecycle-androidTest.apk"
          timeout 240 adb shell am instrument -w -r -e class com.mightyoung.muyon.androidlab.OrdinaryChatServiceLoopTest com.mightyoung.muyon.androidlab.ordinaryChat.test/androidx.test.runner.AndroidJUnitRunner | tee "$evidence/instrumentation.log"
          grep -F 'OK (1 test)' "$evidence/instrumentation.log"
          if grep -E 'FAILURES|INSTRUMENTATION_FAILED|Process crashed' "$evidence/instrumentation.log"; then exit 1; fi
          printf 'PASS: actual Compose Send to private Service same Rust Agent plain fake provider response; synthetic, no network/model call\n' > "$evidence/device-result.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chat-package-device
          path: ${{ runner.temp }}/chat-package
          retention-days: 7
