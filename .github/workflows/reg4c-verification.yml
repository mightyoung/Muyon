name: reg4c-verification

on:
  push:
    branches:
      - task/reg-4c-general-writes

permissions:
  contents: read

concurrency:
  group: reg4c-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reg4c:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Generic write behavior and safety mutations
        run: python3 scripts/reg4c_verify.py
      - name: Keep verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reg4c-verification
          path: /tmp/reg4c-verification
          if-no-files-found: ignore
