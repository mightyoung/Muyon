name: mascot-rive-probe

on:
  push:
    branches: ['task/mascot-rive-probe']
    paths:
      - '.github/workflows/mascot-rive-probe.yml'
      - 'scripts/mascot_rive_probe/**'

permissions:
  contents: read

concurrency:
  group: mascot-rive-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    if: github.event.repository.private == false && contains(github.event.head_commit.message, '[run-mascot-probe]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Install reviewed official CLI 1.5.1 in temporary directory
        shell: bash
        run: |
          set -euo pipefail
          task_probe_dir="$(mktemp -d "$RUNNER_TEMP/muyang-cli.XXXXXX")"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --max-time 30 \
            https://releases.rive.app/cli/install.sh -o "$task_probe_dir/install.sh"
          echo "09e1dc2b14200cb16745a38e4436ad09ab9a1c17a7954fe59009307d3fc66389  $task_probe_dir/install.sh" | sha256sum --check
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --max-time 30 \
            https://releases.rive.app/cli/v1.5.1/manifest.json -o "$task_probe_dir/manifest.json"
          python3 - "$task_probe_dir/manifest.json" <<'PYVERIFY'
          import json, sys
          m=json.load(open(sys.argv[1]))
          assert m['version']=='1.5.1'
          assert m['artifacts']['linux-x64']['sha256']=='f1c99eadc35920f8a0a802bebe8607101e18c581c040ab0dbf98895cff368477'
          PYVERIFY
          RIVE_VERSION=1.5.1 RIVE_HOME="$task_probe_dir/home" RIVE_INSTALL_DIR="$task_probe_dir/bin" timeout 120 bash "$task_probe_dir/install.sh"
          echo "TASK_RIVE=$task_probe_dir/bin/rive" >> "$GITHUB_ENV"
          echo "TASK_PROBE=$task_probe_dir" >> "$GITHUB_ENV"
      - name: Install minimal Ubuntu runtime libraries
        shell: bash
        run: |
          set -euo pipefail
          ldd "$TASK_RIVE"
          sudo apt-get update -qq
          apt-cache policy libegl1 libgles2 libx11-6
          apt-cache show libegl1 libgles2 | sed -n '1,100p'
          sudo apt-get install --no-install-recommends -y libegl1 libgles2 libx11-6
          dpkg-query -W libegl1 libgles2 libx11-6 libglvnd0
          ldd "$TASK_RIVE"
      - name: Read schema and scaffold a synthetic local project
        shell: bash
        run: |
          set -euo pipefail
          "$TASK_RIVE" --version
          for task_type in Mesh MeshVertex Bone RootBone Tendon Skin Image ImageAsset StateMachineNumber StateMachineInput StateMachine; do
            echo "SCHEMA $task_type"
            "$TASK_RIVE" schema "$task_type" || true
          done
          find "$TASK_PROBE/home/versions/1.5.1" -maxdepth 2 -type d
          RIVE_DOCS_DIR="$TASK_PROBE/home/versions/1.5.1/docs" "$TASK_RIVE" docs --list || true
          "$TASK_RIVE" samples --path || true
          "$TASK_RIVE" create "$TASK_PROBE/project"
          cat "$TASK_PROBE/project/AGENTS.md"
          cat "$TASK_PROBE/project/rive.yaml"
          cat "$TASK_PROBE/project/scene.rml"
          "$TASK_RIVE" "$TASK_PROBE/project" --verify --format=json
          "$TASK_RIVE" "$TASK_PROBE/project" --once --format=json
          "$TASK_RIVE" inspect "$TASK_PROBE/project" --json
