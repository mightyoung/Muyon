name: muyon_ui_preview
description: Public fixture semantic UI preview, independent of the native host.
version: 0.1.0+1
publish_to: none
resolution: workspace
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.9
  web: 1.1.1
  muyon_module_api:
    path: ../../packages/muyon_module_api
  muyon_ui:
    path: ../../packages/muyon_ui
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Noto Sans SC
      fonts:
        - asset: ../muyon/assets/fonts/NotoSansSC-VF.ttf
