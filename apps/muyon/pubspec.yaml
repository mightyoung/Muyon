name: muyon
description: Local-first Muyon host and research workspace.
publish_to: none
version: 0.1.0+1
resolution: workspace
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  muyon_module_api:
    path: ../../packages/muyon_module_api
  muyon_ui:
    path: ../../packages/muyon_ui
  research_module:
    path: ../../packages/research_module
  inquiry_module:
    path: ../../packages/inquiry_module
  supplier_core:
    path: ../../packages/supplier_core
  sqlite3: 3.6.0
  path_provider: 2.1.6
  file_picker: 13.1.0
  path: 1.9.1
  crypto: 3.0.7
  pdfrx: 2.6.5
  flutter_secure_storage: ^11.2.0
  uuid: 4.5.3
  flutter_onnxruntime: 1.8.5
  image: 4.10.1
  yaml: 3.1.3
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/ontology_graph/
    - assets/brand/header-mark-v3.png
    - assets/fonts/OFL.txt
    - assets/ocr/
  fonts:
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/NotoSansSC-VF.ttf
