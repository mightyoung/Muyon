[package]
name = "mig20-tail-independent-review"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
unicode-normalization = "=0.1.25"
muyon-rust-agent-host-lab = { path = "/workspace/mig20/experiments/redesign/rust-agent-host-lab/core" }
muyon-core-agent-lab = { path = "/workspace/mig20/experiments/redesign/core-agent-lab/core" }
muyon-web-search-lab = { path = "/workspace/mig20/experiments/redesign/web-search-lab/core" }

[target.'cfg(target_os = "android")'.dependencies]
libsqlite3-sys = { version = "=0.35.0", features = ["bundled"] }

[[test]]
name="review"
path="review.rs"
