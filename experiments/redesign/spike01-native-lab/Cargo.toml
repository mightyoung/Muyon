[package]
name = "spike01_bridge_lab"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindings"]

[features]
bindings = ["uniffi/cli"]

[dependencies]
uniffi = "=0.32.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
unicode-normalization = "=0.1.25"
thiserror = "=2.0.21"

[profile.dev]
debug = 0
incremental = false

[profile.release]
panic = "unwind"
strip = "debuginfo"
